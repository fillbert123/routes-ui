<section class="search">
  <component-title
    [kind]="'standard'"
    [status]="status"
    [title]="(searchResultData) ? 'Result for ' + searchQuery + ':' : null"
  />
  <div class="search__result">
    @switch (status) {
      @case ('active') {
        @if (searchResultData.lineResult.length > 0) {
          <component-list
            [kind]="'routeGroup'"
            [status]="'active'"
            [listHeader]="false"
            [listData]="searchResultData.lineResult"
            [isSearch]="true"
          />
        }
        @if (searchResultData.stationResult.length > 0) {
          <component-list
            [kind]="'station'"
            [status]="'active'"
            [listHeader]="false"
            [listData]="searchResultData.stationResult"
            [isSearch]="true"
          />
        }
        @if (searchResultData.lineResult.length === 0 && searchResultData.stationResult.length === 0) {
          <component-state
            [error]="'noResult'"
          />
        }
      }
      @case ('loading') {
        <component-list
          [kind]="'routeGroup'"
          [status]="'loading'"
          [listHeader]="false"
        />
      }
    }
  </div>
</section>
