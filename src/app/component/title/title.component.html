<div class="title">
  @if (status === 'loading') {
    <div class="title-loading loading"></div>
  }
  @else {
    @if (kind === 'standard') {
      <h1 class="bold xlarge">{{title}}</h1>
    }
    @else if (kind === 'routeGroup') {
      <component-badge
        [kind]="kind"
        [status]="status"
        [label]="badgeLabel"
        [color]="badgeColor"
        [bulkData]="badgeData"
      />
      <h1 class="bold xlarge">{{title}}</h1>
    }
    @else if (kind === 'station') {
      <div class="title__station">
        <component-badge
          [kind]="kind"
          [status]="status"
          [label]="badgeLabel"
          [color]="badgeColor"
          [bulkData]="badgeData"
        />
        <div class="title__station__text">
          <div class="title__station__text__leading">
            <h1 class="bold xlarge">{{title}}</h1>
            <p class="regular medium">{{altTitle.zh}}</p>
            <p class="regular medium">{{altTitle.ta}}</p>
          </div>
          <div class="title__station__text__trailing">
            @if (isStationActive) {
              <component-button
                [size]="'large'"
                [status]="'active'"
                [icon]="'direct'"
                [color]="'primary'"
                [label]="'Direction'"
                (click)="emitDirection()"
              />
            }
          </div>
        </div>
      </div>
    }
  }
</div>
